<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>PCM 35+ Tracker</title><style>body{font-family:system-ui;margin:0;background:#f5f5f5;color:#171717}.wrap{max-width:760px;margin:auto;padding:16px}h1{margin:0}.card,.chapter{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0}.top,.stats,.head{display:flex;justify-content:space-between;gap:10px}.barbg{height:10px;background:#ddd;border-radius:9px}.bar{height:10px;background:#222;border-radius:9px;width:0}.filters{display:flex;flex-wrap:wrap;gap:7px}.filters button,button{padding:8px 12px;border:1px solid #ccc;border-radius:20px;background:#fff}.active{background:#222!important;color:#fff}.subject{margin-top:22px}.task{display:block;padding:8px 0}.task input{width:18px;height:18px;vertical-align:middle;margin-right:8px}.done{text-decoration:line-through;color:#999}.badge{font-size:11px;border:1px solid #ccc;border-radius:20px;padding:4px 7px}.small{font-size:12px;color:#777}</style></head><body><div class='wrap'><div class='top'><div><h1>PCM 35+ Tracker 🎯</h1><p>37 chapters · Learn → PYQs → Revision</p></div><button onclick='resetAll()'>Reset</button></div><div class='card'><div class='stats'><b id='count'>0 / 111</b><b id='pct'>0%</b></div><div class='barbg'><div class='bar' id='bar'></div></div><p class='small' id='full'>0 / 37 chapters complete</p></div><div class='card'><div class='filters' id='subjects'><button class='active' onclick="filterSub('All',this)">All</button><button onclick="filterSub('Physics',this)">Physics</button><button onclick="filterSub('Maths',this)">Maths</button><button onclick="filterSub('Chemistry',this)">Chemistry</button></div></div><div id='list'></div><p class='small'>Progress is saved on this device.</p></div><script>
const P=['Physical World','Units and Measurements','Motion in a Straight Line','Motion in a Plane','Laws of Motion','Work, Energy and Power','System of Particles and Rotational Motion','Gravitation','Mechanical Properties of Solids','Mechanical Properties of Fluids','Thermal Properties of Matter','Thermodynamics','Kinetic Theory','Oscillations','Waves'];
const M=Array.from({length:12},(_,i)=>'Maths Chapter '+(i+1)); const C=Array.from({length:10},(_,i)=>'Chemistry Chapter '+(i+1));
const data=[...P.map((n,i)=>({id:'P'+i,s:'Physics',n})),...M.map((n,i)=>({id:'M'+i,s:'Maths',n})),...C.map((n,i)=>({id:'C'+i,s:'Chemistry',n}))];
const stages=['Learn concepts','PYQs / questions','Revision / recall']; let sub='All'; let done=JSON.parse(localStorage.getItem('pcm35')||'{}');
function save(){localStorage.setItem('pcm35',JSON.stringify(done))} function render(){let L=document.getElementById('list');L.innerHTML='';let last='';data.filter(x=>sub==='All'||x.s===sub).forEach(c=>{if(c.s!==last){last=c.s;L.innerHTML+=`<h2 class='subject'>${c.s}</h2>`}let d=document.createElement('div');d.className='chapter';d.innerHTML=`<div class='head'><b>${c.n}</b><span class='badge'>35+ focus</span></div>`;stages.forEach((t,i)=>{let k=c.id+'-'+i;let lab=document.createElement('label');lab.className='task';let cb=document.createElement('input');cb.type='checkbox';cb.checked=!!done[k];let sp=document.createElement('span');sp.textContent=t;if(cb.checked)sp.className='done';cb.onchange=()=>{done[k]=cb.checked;save();sp.className=cb.checked?'done':'';update()};lab.append(cb,sp);d.append(lab)});L.append(d)});update()} function update(){let total=111,n=Object.values(done).filter(Boolean).length,p=Math.round(n/total*100);document.getElementById('count').textContent=n+' / '+total+' tasks';document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%';let f=data.filter(c=>stages.every((_,i)=>done[c.id+'-'+i])).length;document.getElementById('full').textContent=f+' / 37 chapters complete'} function filterSub(x,b){sub=x;document.querySelectorAll('#subjects button').forEach(q=>q.classList.remove('active'));b.classList.add('active');render()} function resetAll(){if(confirm('Reset all progress?')){done={};save();render()}} render();</script></body></html>
